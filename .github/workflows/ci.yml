name: verify

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build --preset default --parallel
      - name: Test
        run: ctest --preset default
      - name: Generate synthetic evidence
        run: |
          ./build/default/flightlab_run --backend synthetic --output results/ci-nominal.csv
          python3 tools/plot_telemetry.py results/ci-nominal.csv results/ci-nominal.svg
      - name: Check frozen synthetic design targets
        run: python3 tools/check_acceptance.py configs/acceptance.json results/ci-nominal.summary.json
      - name: Exercise JSBSim reference
        run: ./build/default/flightlab_run --backend jsbsim --output results/ci-jsbsim.csv
